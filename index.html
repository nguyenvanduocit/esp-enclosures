<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1e20">
<title>Bàn in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23232527'/%3E%3Cpath d='m16 5 10 6v11l-10 5-10-5V11zM6 11l10 6 10-6M16 17v10' fill='none' stroke='%23b7cebf' stroke-width='1.5'/%3E%3C/svg%3E">

<body>
<section id="gallery" class="gallery">
<header class="gallery-header"><h1>Bàn in</h1><a href="https://github.com/nguyenvanduocit/esp-enclosures" target="_blank" rel="noopener">GitHub ↗</a></header>
<div class="gallery-tools"><label><span class="sr-only">Tìm model</span><input id="search" type="search" placeholder="Tìm model…" autocomplete="off"></label></div>
<div id="cards" class="cards"></div>
<p id="empty" class="empty" hidden>Không tìm thấy model.</p>
</section>
<div id="workspace" hidden>
<aside aria-label="Điều khiển">
<div class="sidebar-header"><a href="#" class="back-link" aria-label="Về danh sách" title="Về danh sách"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></a><h1 id="modelTitle"></h1></div>
<div class="sidebar-body" id="sidebarBody">
<details class="menu animation-menu" id="animationMenu" open>
<summary><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg>Animation</summary>
<div class="playback">
<button id="play" disabled aria-label="Phát" aria-pressed="false" title="Phát"><svg class="icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z" fill="currentColor" stroke="none"/></svg><svg class="icon pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button>
<select id="mode" aria-label="Animation"></select>
<input class="timeline" id="timeline" aria-label="Tua animation" type="range" min="0" max="1000" value="0">
<button id="reset" aria-label="Đặt lại" title="Đặt lại"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8 M3 4v6h6"/></svg></button>
</div></details>
<details class="menu" id="displayMenu"><summary><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-5 9 5-9 5Z M3 12l9 5 9-5 M3 17l9 5 9-5"/></svg>Hiển thị</summary><div class="panel">
<div id="partControls"></div>
<hr>
<label><input id="wireframe" type="checkbox">Lưới</label>
<div class="views" id="viewControls"></div>
</div></details>
<details class="menu" id="measureMenu"><summary><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="m3 15 12-12 6 6-12 12Z M12 6l3 3 M9 9l2 2 M6 12l3 3"/></svg>Đo</summary><div class="panel" id="measurementControls">
</div></details>
</div>
<div class="sidebar-footer"><button id="openPrint"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4 M4 16v5h16v-5"/></svg>In & tải</button></div>
</aside>
<main aria-label="Mô hình 3D"><div class="canvas-wrap" id="stage"><canvas class="scene" id="canvas" tabindex="0" aria-label="Mô hình 3D. Kéo chi tiết để tháo; kéo nền để xoay."></canvas><div id="partTip" class="part-tip" hidden></div><div id="loading">Đang tải…</div><div id="error" role="alert"></div></div>
</main>
</div>
<dialog id="printDialog" aria-labelledby="printTitle"><div class="dialog-header"><h2 id="printTitle">In 3D</h2><button id="closePrint" aria-label="Đóng"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12 M6 18 18 6"/></svg></button></div>
<h3>STL</h3><div class="downloads" id="downloads"></div>
<a class="bundle" id="bundleDownload" download>Tải tất cả (.zip)</a>
<a class="bundle" id="stepDownload" download>STEP</a>
<div class="print-info"><p class="material-total" id="printSummary"></p><div id="printSections"></div></div></dialog>

<p id="appError" role="alert" hidden></p>
